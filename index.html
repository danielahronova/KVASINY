<!DOCTYPE html>
<html lang="cs-cz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrační formulář letní turnaj Kvasiny 2026</title>
    <link rel = "stylesheet" href = style.css>
</head>
<body>
<div class = "page">
<div class = "form-wrapper">

    <h1>Registrace na letní turnaj VK Kvasiny 2026</h1>

    <form id = "registrationForm"method="POST" action="https://script.google.com/macros/s/AKfycbwnOlFRc7noW3BgLpYeaMtUA33HFmYuLGnzQuOdjr-nZkLJWeP_1vEqMFMaNIBdAQDeMw/exec" target="hidden_iframe">

        <div class = "field team">
            <label for = "team">Název týmu</label>
            <input type = "text" id = "team" name = "team" required size="30">
        </div>

         <div class = "field category">
            <label for = "category">Kategorie</label>
            <select id = "category" name = "category" required>
                <option value ="">-- Vyber kategorii --</option>
                <option value = "Ženy">Ženy</option>
                <option value = "Muži">Muži</option>
            </select>
        </div>

        <div class = "field contact-person">
            <label for = "contactPerson">Kontaktní osoba</label>
            <input type = "text" id = "contactPerson" name = "contactPerson" required size="30">
        </div>
        
        <div class = "field phone-number">
            <label for = "phoneNumber">Telefonní číslo</label>
            <input type = "tel" id = "phoneNumber" name = "phone" required size="9">
        </div>

        <div class = "field email">
            <label for = "email">E-mail</label>
            <input type = "email" id ="email" name = "email" required size="25">
        </div>

        <div class = "field button">
            <button type = "submit" id = "submitBtn">
            Přihlásit tým
            </button>
        </div>

        <div id = "formMessage"></div>
        

    </form>
    <iframe name="hidden_iframe" style="display:none;"></iframe>
   

</div>
</div>


<script>
    
    const form = document.getElementById("registrationForm");
    const teamInput = document.getElementById("team");
    const category = document.getElementById("category");
    const contactPerson = document.getElementById("contactPerson");
    const phoneNumber = document.getElementById("phoneNumber");
    const email = document.getElementById("email");
    const formMessage = document.getElementById("formMessage");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", function (e) {
    

        if (teamInput.value.trim() === "") {
            formMessage.textContent = "Zadejte název týmu";
            teamInput.focus();
            return;
        }

        if (category.value.trim() === "") {
            formMessage.textContent = "Vyberte kategorii";
            category.focus();
            return;
        }

        if (contactPerson.value.trim() === "") {
            formMessage.textContent = "Zadejte jméno kontaktní osoby";
            contactPerson.focus();
            return;
        }

        if (phoneNumber.value.trim() === "") {
            formMessage.textContent = "Zadejte telefonní číslo";
            phoneNumber.focus();
            return;
        }

        if (email.value.trim() === "") {
            formMessage.textContent = "Zadejte e-mail";
            email.focus();
            return;
        }

        if (!email.value.includes("@")) {
            formMessage.textContent = "E-mail není platný";
            email.focus();
            return;
        }

        formMessage.textContent = "Děkujeme za registraci!";
        setTimeout(() => form.reset(), 500);
        })

   
 


    
</script>
    
</body>
</html>
